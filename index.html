<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#CDEBFA">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<title>Kočičí skákačka</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #CDEBFA;
    overscroll-behavior: none;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #name {
    display: none;
    position: fixed;
    box-sizing: border-box;
    border: none;
    outline: none;
    background: transparent;
    color: #3A2F45;
    font-family: "Nunito", "Arial Rounded MT Bold", system-ui, sans-serif;
    font-weight: 800;
    text-align: center;
    user-select: text;
    -webkit-user-select: text;
    touch-action: manipulation;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<input id="name" type="text" autocomplete="off" autocapitalize="words" spellcheck="false" enterkeyhint="done" aria-label="Jméno">
<script type="module" src="src/main.js"></script>
<script>
  // Offline režim: service worker uloží hru do tabletu.
  if ('serviceWorker' in navigator && !location.search.includes('nosw')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
</script>
</body>
</html>
