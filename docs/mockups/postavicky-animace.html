<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kočičí skákačka – schválený vzor postaviček</title>
<style>
body{margin:0;padding:16px;background:#fff;font-family:system-ui,sans-serif}
.la{animation:lg .3s infinite alternate ease-in-out;transform-box:fill-box;transform-origin:50% 0}
.lb{animation:lg .3s -.3s infinite alternate ease-in-out;transform-box:fill-box;transform-origin:50% 0}
@keyframes lg{from{transform:rotate(32deg)}to{transform:rotate(-32deg)}}
.bob{animation:bob .15s infinite alternate ease-in-out}@keyframes bob{to{transform:translateY(-2.5px)}}
.ct{animation:ct .3s infinite alternate ease-in-out;transform-box:fill-box;transform-origin:100% 100%}@keyframes ct{from{transform:rotate(-12deg)}to{transform:rotate(14deg)}}
.ft{animation:ft .32s infinite ease-in-out;transform-box:fill-box;transform-origin:0% 50%}@keyframes ft{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.25)}}
.fb{animation:fb .32s infinite ease-in-out;transform-box:fill-box;transform-origin:50% 50%}@keyframes fb{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.94)}}
.ff{animation:ff 1.4s infinite alternate ease-in-out}.ff2{animation-delay:-.7s}@keyframes ff{from{transform:translateY(-4px) rotate(-4deg)}to{transform:translateY(4px) rotate(4deg)}}
.sb{animation:sb .9s infinite alternate ease-in-out}@keyframes sb{from{transform:translateY(-7px) rotate(-6deg)}to{transform:translateY(7px) rotate(5deg)}}
.st{animation:st .12s infinite alternate ease-in-out;transform-box:fill-box;transform-origin:0% 100%}@keyframes st{from{transform:rotate(-22deg)}to{transform:rotate(18deg)}}
.sa{animation:sa .14s infinite alternate ease-in-out;transform-box:fill-box;transform-origin:100% 50%}@keyframes sa{from{transform:rotate(-35deg)}to{transform:rotate(25deg)}}
.sp{animation:sp .45s infinite steps(1)}@keyframes sp{0%{transform:translate(0,0)}25%{transform:translate(1.4px,-1px)}50%{transform:translate(-1.2px,1px)}75%{transform:translate(1px,1.2px)}}
.ae{transform-box:fill-box;transform-origin:50% 50%;transition:transform .07s}.ae.bl{transform:scaleY(.12)}
</style>
</head>
<body>
<!-- Schválený vzor vzhledu a animací (2026-10-21). Ve hře se kreslí na Canvas,
     tvary a barvy převzít odsud. Souřadnice postaviček: (0,0) = bod na zemi. -->
<svg width="100%" viewBox="0 0 680 290" role="img" aria-label="Animovaná scéna">
<defs><clipPath id="c2"><rect x="0" y="0" width="680" height="290" rx="12"/></clipPath>
<g id="avo"><path d="M0,-56 C16,-56 30,-32 30,-19 C30,-6 17,0 0,0 C-17,0 -30,-6 -30,-19 C-30,-32 -16,-56 0,-56Z" fill="#6FA552" stroke="#4A3F45" stroke-width="2.2"/><path d="M0,-49 C12,-49 24,-30 24,-19 C24,-9 13,-5 0,-5 C-13,-5 -24,-9 -24,-19 C-24,-30 -12,-49 0,-49Z" fill="#E4F2A8"/><circle cx="0" cy="-18" r="10" fill="#B07A52" stroke="#4A3F45" stroke-width="2"/><path d="M-3,-30.5 q1.5,2 3,0 q1.5,2 3,0" fill="none" stroke="#4A3F45" stroke-width="1.3" stroke-linecap="round"/><ellipse cx="-12" cy="-30" rx="3" ry="2" fill="#FF9AB0" opacity="0.7"/><ellipse cx="12" cy="-30" rx="3" ry="2" fill="#FF9AB0" opacity="0.7"/></g>
</defs>
<g clip-path="url(#c2)">
<rect width="680" height="290" fill="#CDEBFA"/>
<g fill="#fff"><ellipse cx="140" cy="60" rx="34" ry="13"/><ellipse cx="160" cy="50" rx="20" ry="13"/><ellipse cx="470" cy="45" rx="36" ry="12"/></g>
<path d="M0,190 Q110,130 220,180 T440,175 T680,180 V240 H0Z" fill="#D5EFCB"/>
<path d="M0,222 Q130,180 260,215 T520,210 T680,212 V240 H0Z" fill="#AEDDA2"/>
<rect y="226" width="680" height="16" fill="#92CD7E"/><rect y="240" width="680" height="50" fill="#F7E6C4"/>

<!-- Kočička (skin Mourek) -->
<g transform="translate(110,240)">
<rect class="la" x="-31" y="-9" width="10" height="10" rx="4.5" fill="#B9BAC2" stroke="#4A3F45" stroke-width="2.2"/>
<rect class="lb" x="-16" y="-9" width="10" height="10" rx="4.5" fill="#B9BAC2" stroke="#4A3F45" stroke-width="2.2"/>
<rect class="lb" x="18" y="-9" width="10" height="10" rx="4.5" fill="#B9BAC2" stroke="#4A3F45" stroke-width="2.2"/>
<rect class="la" x="33" y="-9" width="10" height="10" rx="4.5" fill="#B9BAC2" stroke="#4A3F45" stroke-width="2.2"/>
<g class="bob">
<g class="ct"><path d="M-38,-20 C-46,-24 -50,-30 -52,-36" fill="none" stroke="#4A3F45" stroke-width="13" stroke-linecap="round"/><path d="M-38,-20 C-46,-24 -50,-30 -52,-36" fill="none" stroke="#B9BAC2" stroke-width="8.5" stroke-linecap="round"/><path d="M-46,-25 l3,-4 M-50,-31 l4,-2" stroke="#6F717C" stroke-width="2.6" stroke-linecap="round"/></g>
<path d="M24,-51 L28,-66 L37,-55Z" fill="#B9BAC2" stroke="#4A3F45" stroke-width="2.2" stroke-linejoin="round"/>
<path d="M43,-56 L51,-66 L55,-50Z" fill="#B9BAC2" stroke="#4A3F45" stroke-width="2.2" stroke-linejoin="round"/>
<path d="M-38,-4 C-47,-22 -36,-44 -8,-46 C8,-47 22,-58 38,-56 C56,-54 63,-36 57,-20 C53,-6 40,-2 20,-2 L-30,-2 C-35,-2 -37,-3 -38,-4Z" fill="#B9BAC2" stroke="#4A3F45" stroke-width="2.2" stroke-linejoin="round"/>
<path d="M38,-54 v6 M44,-55 v6 M50,-53 v5 M-14,-46 q3,5 0,10 M-4,-46 q3,5 0,10 M6,-47 q3,5 0,10" fill="none" stroke="#6F717C" stroke-width="2.6" stroke-linecap="round"/>
<ellipse cx="36" cy="-29" rx="3.6" ry="2.2" fill="#FF9AB0" opacity="0.7"/><ellipse cx="56" cy="-30" rx="3" ry="2.2" fill="#FF9AB0" opacity="0.7"/>
<ellipse cx="40" cy="-37" rx="2.2" ry="2.9" fill="#3A3238"/><ellipse cx="52" cy="-37.5" rx="2.2" ry="2.9" fill="#3A3238"/>
<path d="M43.5,-31 q1.5,2.2 3,0 q1.5,2.2 3,0" fill="none" stroke="#3A3238" stroke-width="1.4" stroke-linecap="round"/>
</g></g>

<!-- Avokáda: malé, velké, dvojice; oči mrkají nezávisle -->
<g transform="translate(290,242) scale(0.72)"><use href="#avo"/><g class="ae avo-eyes"><ellipse cx="-6" cy="-35" rx="2" ry="2.6" fill="#4A3F45"/><ellipse cx="6" cy="-35" rx="2" ry="2.6" fill="#4A3F45"/></g></g>
<g transform="translate(520,242)"><use href="#avo"/><g class="ae avo-eyes"><ellipse cx="-6" cy="-35" rx="2" ry="2.6" fill="#4A3F45"/><ellipse cx="6" cy="-35" rx="2" ry="2.6" fill="#4A3F45"/></g></g>
<g transform="translate(560,242) scale(0.7)"><use href="#avo"/><g class="ae avo-eyes"><ellipse cx="-6" cy="-35" rx="2" ry="2.6" fill="#4A3F45"/><ellipse cx="6" cy="-35" rx="2" ry="2.6" fill="#4A3F45"/></g></g>

<!-- Rybičky: ocas mrská do stran (scaleX), tělo se nepatrně smršťuje -->
<g transform="translate(260,150)"><g class="ff">
<path class="ft" d="M10,0 L22,-9 Q19,0 22,9Z" fill="#8EC8F0" stroke="#4A3F45" stroke-width="2" stroke-linejoin="round"/>
<g class="fb"><ellipse cx="0" cy="0" rx="14" ry="10" fill="#B6DDF7" stroke="#4A3F45" stroke-width="2"/><ellipse cx="-6" cy="-1.5" rx="1.6" ry="2.1" fill="#4A3F45"/><path d="M-10,3.5 q1.5,1.6 3,0" fill="none" stroke="#4A3F45" stroke-width="1.2" stroke-linecap="round"/></g>
</g></g>
<g transform="translate(305,128)"><g class="ff ff2">
<path class="ft" style="animation-delay:-.16s" d="M10,0 L22,-9 Q19,0 22,9Z" fill="#8EC8F0" stroke="#4A3F45" stroke-width="2" stroke-linejoin="round"/>
<g class="fb" style="animation-delay:-.16s"><ellipse cx="0" cy="0" rx="14" ry="10" fill="#B6DDF7" stroke="#4A3F45" stroke-width="2"/><ellipse cx="-6" cy="-1.5" rx="1.6" ry="2.1" fill="#4A3F45"/><path d="M-10,3.5 q1.5,1.6 3,0" fill="none" stroke="#4A3F45" stroke-width="1.2" stroke-linecap="round"/></g>
</g></g>

<!-- Veverka: malá, vtipná (těkající panenky, jazýček, ocas-vrtule, šmrdlající packa) -->
<g transform="translate(430,110)"><g class="sb">
<path class="st" d="M12,-3 C34,-5 40,-26 27,-36 C18,-42 7,-33 15,-25 C19,-19 16,-11 8,-8Z" fill="#E0A06A" stroke="#4A3F45" stroke-width="2" stroke-linejoin="round"/>
<path class="sa" d="M-26,-6 L-12,1" stroke="#4A3F45" stroke-width="7" stroke-linecap="round"/>
<path class="sa" d="M-26,-6 L-12,1" stroke="#E8B07E" stroke-width="3.5" stroke-linecap="round"/>
<path d="M10,6 L20,11" stroke="#4A3F45" stroke-width="6" stroke-linecap="round"/><path d="M10,6 L20,11" stroke="#E8B07E" stroke-width="2.5" stroke-linecap="round"/>
<path d="M-20,0 C-21,-12 -11,-17 0,-15 C12,-14 17,-6 15,0 C14,6 5,8 -6,8 C-15,8 -19,5 -20,0Z" fill="#E8B07E" stroke="#4A3F45" stroke-width="2"/>
<path d="M-16,-14 L-14,-22 L-9,-15Z" fill="#E8B07E" stroke="#4A3F45" stroke-width="1.8" stroke-linejoin="round"/>
<circle cx="-15" cy="-7" r="4.2" fill="#fff" stroke="#4A3F45" stroke-width="1.4"/><circle cx="-5.5" cy="-7.5" r="4.2" fill="#fff" stroke="#4A3F45" stroke-width="1.4"/>
<g class="sp"><circle cx="-16" cy="-6.5" r="1.8" fill="#3A3238"/><circle cx="-6.5" cy="-7" r="1.8" fill="#3A3238"/></g>
<path d="M-15,-1 q4,6 8,0Z" fill="#8A3B4A" stroke="#4A3F45" stroke-width="1.2" stroke-linejoin="round"/>
<ellipse cx="-11" cy="2.6" rx="2.2" ry="2.6" fill="#FF8FA5"/>
<ellipse cx="-18" cy="-1" rx="2.2" ry="1.5" fill="#FF9AB0" opacity="0.7"/>
</g></g>
</g>
</svg>
<script>
document.querySelectorAll('.avo-eyes').forEach(function(e){function t(){setTimeout(function(){e.classList.add('bl');setTimeout(function(){e.classList.remove('bl');if(Math.random()<.25)setTimeout(function(){e.classList.add('bl');setTimeout(function(){e.classList.remove('bl')},130)},180);t()},130)},1200+Math.random()*3800)}t()});
</script>
</body>
</html>
