name: Nasazení na GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Připravit soubory hry
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js icons src _site/
          # nová verze cache při každém nasazení → tablet si stáhne aktualizaci
          sed -i "s/const CACHE_VERSION = 'kocka-v1'/const CACHE_VERSION = 'kocka-${GITHUB_SHA::8}'/" _site/sw.js
          grep -q "kocka-${GITHUB_SHA::8}" _site/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
